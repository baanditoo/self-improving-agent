[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-agent"
version = "0.2.0"
description = "Self-improving Solana memecoin agent: 2x initial, then manage the runner. Paper trading by default."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[project.scripts]
self-improving-agent = "self_improving_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["self_improving_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
